<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SABET Signal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at top, #1a0033, #000);
    color: #fff;
    min-height: 100vh;
    padding: 12px;
  }
  .header {
    text-align: center;
    padding: 16px;
    background: linear-gradient(90deg, #ff00cc, #00ffcc);
    color: #000;
    border-radius: 14px;
    font-weight: 900;
    font-size: 26px;
    margin-bottom: 10px;
    box-shadow: 0 0 30px #ff00cc88;
    letter-spacing: 4px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(90deg, #0d0d1f, #1a0033);
    border: 1px solid #00ffcc55;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 12px;
    font-size: 13px;
    box-shadow: 0 0 15px #00ffcc22;
  }
  .top-bar .period-label { color: #888; font-size: 11px; }
  .top-bar .period {
    color: #00ffcc;
    font-weight: bold;
    font-size: 16px;
    display: block;
    text-shadow: 0 0 10px #00ffcc;
  }
  .top-bar .timer-label { color: #888; font-size: 11px; text-align: right; }
  .top-bar .timer {
    color: #ffd700;
    font-weight: bold;
    font-size: 22px;
    display: block;
    text-shadow: 0 0 10px #ffd700;
    font-family: 'Courier New', monospace;
  }
  .main-box {
    background: linear-gradient(145deg, #0d0d1f, #1a0033);
    border: 2px solid #00ffcc;
    border-radius: 18px;
    padding: 24px;
    text-align: center;
    box-shadow: 0 0 35px #00ffcc55, inset 0 0 25px #00ffcc11;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
  }
  .main-box::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(from 0deg, transparent, #00ffcc33, transparent, #ff00cc33, transparent);
    animation: rotate 8s linear infinite;
    z-index: 0;
  }
  @keyframes rotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .main-box > * { position: relative; z-index: 1; }
  .label {
    font-size: 12px;
    color: #ff00cc;
    text-transform: uppercase;
    letter-spacing: 4px;
    font-weight: bold;
  }
  .signal-big {
    font-size: 60px;
    font-weight: 900;
    margin: 10px 0;
    text-shadow: 0 0 30px currentColor;
    letter-spacing: 3px;
  }
  .signal-num {
    font-size: 52px;
    font-weight: 900;
    color: #ffd700;
    margin: 4px 0;
    text-shadow: 0 0 25px #ffd700;
    font-family: 'Courier New', monospace;
  }
  .signal-color {
    font-size: 18px;
    margin-top: 8px;
    font-weight: bold;
    letter-spacing: 1px;
  }
  .confidence {
    margin-top: 16px;
    font-size: 14px;
    color: #ccc;
    font-weight: bold;
  }
  .conf-value {
    color: #00ffcc;
    font-size: 20px;
    text-shadow: 0 0 10px #00ffcc;
  }
  .conf-bar {
    height: 12px;
    background: #111;
    border-radius: 6px;
    margin-top: 10px;
    overflow: hidden;
    border: 1px solid #333;
    position: relative;
  }
  .conf-fill {
    height: 100%;
    background: linear-gradient(90deg, #00ffcc, #ff00cc);
    width: 0%;
    transition: width 0.8s ease;
    box-shadow: 0 0 15px #00ffcc;
    position: relative;
  }
  .conf-fill::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent, #fff5, transparent);
    animation: shine 2s infinite;
  }
  @keyframes shine {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }
  .stats {
    display: flex;
    justify-content: space-around;
    margin: 12px 0;
    gap: 8px;
  }
  .stat-box {
    flex: 1;
    background: linear-gradient(145deg, #0d0d1f, #1a0033);
    padding: 14px 8px;
    border-radius: 12px;
    border: 1px solid #00ffcc44;
    text-align: center;
    box-shadow: 0 0 12px #00ffcc22;
  }
  .stat-num {
    font-size: 26px;
    font-weight: 900;
    display: block;
    text-shadow: 0 0 12px currentColor;
    font-family: 'Courier New', monospace;
  }
  .stat-label {
    font-size: 11px;
    color: #aaa;
    letter-spacing: 2px;
    margin-top: 4px;
  }
  .win .stat-num { color: #00ff88; }
  .loss .stat-num { color: #ff4466; }
  .total .stat-num { color: #ffd700; }
  .section-title {
    color: #00ffcc;
    font-size: 13px;
    margin: 14px 0 8px;
    letter-spacing: 3px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .section-title .count {
    color: #ffd700;
    font-size: 14px;
    background: #1a0033;
    padding: 2px 10px;
    border-radius: 10px;
    border: 1px solid #ffd70055;
  }
  .history {
    max-height: 340px;
    overflow-y: auto;
    background: linear-gradient(145deg, #050510, #0d0d1f);
    border-radius: 12px;
    padding: 8px;
    border: 1px solid #00ffcc33;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 10px;
    border-bottom: 1px solid #1a1a2e;
    font-size: 13px;
    border-radius: 8px;
    margin-bottom: 4px;
    background: #0a0a15;
  }
  .history-item:last-child { border-bottom: none; }
  .h-issue { color: #666; font-size: 11px; font-family: monospace; }
  .h-pred { color: #00ccff; font-weight: bold; }
  .h-arrow { color: #666; }
  .h-actual { color: #ffd700; font-weight: bold; }
  .h-result { font-weight: bold; letter-spacing: 1px; }
  .win-text { color: #00ff88; text-shadow: 0 0 8px #00ff88; }
  .loss-text { color: #ff4466; text-shadow: 0 0 8px #ff4466; }
  .status {
    text-align: center;
    font-size: 11px;
    color: #666;
    margin-top: 10px;
  }
  .loading {
    color: #00ffcc;
    font-size: 18px;
    animation: pulse 1.5s infinite;
    letter-spacing: 2px;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .empty {
    text-align: center;
    color: #555;
    padding: 25px;
    font-size: 13px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<div class="header">SABET</div>

<div class="top-bar">
  <div>
    <span class="period-label">NEXT PERIOD</span>
    <span class="period" id="periodNum">----</span>
  </div>
  <div>
    <span class="timer-label">TIME LEFT</span>
    <span class="timer" id="timerNum">--s</span>
  </div>
</div>

<div class="main-box">
  <div class="label">SIGNAL</div>
  <div id="signalBig" class="signal-big loading">LOADING...</div>
  <div id="signalNum" class="signal-num">-</div>
  <div id="signalColor" class="signal-color">-</div>
  <div class="confidence">
    ACCURACY: <span class="conf-value" id="confText">0%</span>
  </div>
  <div class="conf-bar"><div class="conf-fill" id="confFill"></div></div>
</div>

<div class="stats">
  <div class="stat-box win">
    <span class="stat-num" id="winCount">0</span>
    <span class="stat-label">WIN</span>
  </div>
  <div class="stat-box loss">
    <span class="stat-num" id="lossCount">0</span>
    <span class="stat-label">LOSS</span>
  </div>
  <div class="stat-box total">
    <span class="stat-num" id="totalCount">0</span>
    <span class="stat-label">TOTAL</span>
  </div>
</div>

<div class="section-title">
  <span>📊 HISTORY</span>
  <span class="count" id="histCount">0</span>
</div>
<div class="history" id="history">
  <div class="empty">No results yet</div>
</div>

<div class="status" id="status">Connecting...</div>

<script>
// ---------- CONFIG ----------
const API = 'https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?ts=';
const REFRESH_MS = 5000;       // চেক প্রতি ৫ সেকেন্ড
const PERIOD_SECONDS = 30;

// ---------- STATE ----------
let lastIssue = null;
let lastPrediction = null;
let winCount = 0, lossCount = 0;
let historyData = [];
let lastLossSignal = null;
let lossStreak = 0;
let nextPeriodNum = null;
let periodEndTime = 0;

// ---------- COLOR MAP ----------
const COLOR_MAP = {
  0: { color: 'RED+VIOLET', emoji: '🔴🟣', type: 'SMALL' },
  1: { color: 'GREEN',      emoji: '🟢',    type: 'SMALL' },
  2: { color: 'RED',        emoji: '🔴',    type: 'SMALL' },
  3: { color: 'GREEN',      emoji: '🟢',    type: 'SMALL' },
  4: { color: 'RED',        emoji: '🔴',    type: 'SMALL' },
  5: { color: 'GREEN+VIOLET', emoji: '🟢🟣', type: 'BIG' },
  6: { color: 'RED',        emoji: '🔴',    type: 'BIG' },
  7: { color: 'GREEN',      emoji: '🟢',    type: 'BIG' },
  8: { color: 'RED',        emoji: '🔴',    type: 'BIG' },
  9: { color: 'GREEN',      emoji: '🟢',    type: 'BIG' }
};

// ---------- TIMER ----------
function updateTimer() {
  if (!periodEndTime) return;
  const now = Date.now();
  let remain = Math.ceil((periodEndTime - now) / 1000);
  if (remain < 0) remain = 0;
  const el = document.getElementById('timerNum');
  el.textContent = remain + 's';
  el.style.color = remain <= 5 ? '#ff4466' : '#ffd700';
  if (remain <= 5) el.style.textShadow = '0 0 15px #ff4466';
  else el.style.textShadow = '0 0 10px #ffd700';
}
setInterval(updateTimer, 500);

// ---------- ANALYSIS (ENHANCED) ----------
function analyze(list) {
  if (!list || list.length < 15) return null;

  const recent = list.slice(0, 50).map(x => ({
    num: parseInt(x.number),
    big: parseInt(x.number) >= 5,
    color: x.color
  }));

  // Big/Small counts (last 30)
  let bigCount = 0, smallCount = 0;
  recent.slice(0, 30).forEach(r => r.big ? bigCount++ : smallCount++);

  // Current streak
  let currentStreak = 1;
  for (let i = 1; i < recent.length; i++) {
    if (recent[i].big === recent[0].big) currentStreak++;
    else break;
  }

  // Last patterns
  const last5 = recent.slice(0, 5).map(r => r.big ? 'B' : 'S').join('');
  const last6 = recent.slice(0, 6).map(r => r.big ? 'B' : 'S').join('');
  const last8 = recent.slice(0, 8).map(r => r.big ? 'B' : 'S').join('');

  // Number frequency (last 30)
  const freq = {};
  for (let i = 0; i <= 9; i++) freq[i] = 0;
  recent.slice(0, 30).forEach(r => freq[r.num]++);

  // Sort by least frequency
  let candidateNums = [];
  for (let i = 0; i <= 9; i++) candidateNums.push({ num: i, count: freq[i] });
  candidateNums.sort((a, b) => a.count - b.count);

  // ---------- PREDICTION ----------
  let predictBig;
  let reason = '';

  // 1. Loss recovery — FLIP
  if (lossStreak >= 1 && lastLossSignal !== null) {
    predictBig = !lastLossSignal;
    reason = 'recovery';
  }
  // 2. Long streak break (5+)
  else if (currentStreak >= 5) {
    predictBig = !recent[0].big;
    reason = 'streak-break';
  }
  // 3. Alternating pattern BSBSB
  else if (last5 === 'BSBSB' || last5 === 'SBSBS') {
    predictBig = !recent[0].big;
    reason = 'alternate';
  }
  // 4. Double pattern BBSS or SSBB
  else if (last6 === 'BBSSBB' || last6 === 'SSBBSS') {
    predictBig = !recent[0].big;
    reason = 'pattern';
  }
  // 5. Imbalance correction
  else if (bigCount > smallCount + 5) {
    predictBig = false;
    reason = 'imbalance';
  }
  else if (smallCount > bigCount + 5) {
    predictBig = true;
    reason = 'imbalance';
  }
  // 6. 3+ streak — 55% continue
  else if (currentStreak >= 3) {
    predictBig = Math.random() < 0.55 ? recent[0].big : !recent[0].big;
    reason = 'streak-follow';
  }
  // 7. Random with slight bias
  else {
    predictBig = Math.random() > 0.5;
    reason = 'random';
  }

  // Number prediction
  const targetType = predictBig ? 'BIG' : 'SMALL';
  const validNums = candidateNums.filter(c => COLOR_MAP[c.num].type === targetType);
  let predictNum = validNums.length > 0 ? validNums[0].num : (predictBig ? 7 : 2);

  // Confidence
  let conf = 58;
  if (currentStreak >= 5) conf += 18;
  else if (currentStreak >= 3) conf += 10;
  if (Math.abs(bigCount - smallCount) > 5) conf += 12;
  if (lossStreak >= 1) conf += 6;
  if (reason === 'recovery') conf += 5;
  conf = Math.min(conf, 94);

  return {
    big: predictBig,
    num: predictNum,
    color: COLOR_MAP[predictNum].color,
    emoji: COLOR_MAP[predictNum].emoji,
    confidence: Math.round(conf),
    reason: reason,
    streak: currentStreak
  };
}

// ---------- FETCH ----------
async function fetchHistory() {
  try {
    const res = await fetch(API + Date.now());
    const json = await res.json();
    if (json && json.data && json.data.list) {
      processData(json.data.list);
    } else {
      document.getElementById('status').textContent = 'No data received';
    }
  } catch (e) {
    document.getElementById('status').textContent = 'Connection error — retrying...';
  }
}

// ---------- PROCESS ----------
function processData(list) {
  if (!list || list.length === 0) return;
  const latest = list[0];

  // Calculate next period number and timer
  const currentIssue = latest.issueNumber;
  const issueNum = parseInt(currentIssue);
  nextPeriodNum = (issueNum + 1).toString();

  // Timer sync — based on latest issue
  if (lastIssue !== currentIssue) {
    periodEndTime = Date.now() + (PERIOD_SECONDS * 1000);
  }

  document.getElementById('periodNum').textContent = nextPeriodNum.slice(-4);

  // New round detection
  if (lastIssue && lastIssue !== currentIssue) {
    if (lastPrediction) {
      const actualNum = parseInt(latest.number);
      const actualBig = actualNum >= 5;
      const won = (actualBig === lastPrediction.big);

      if (won) {
        winCount++;
        lossStreak = 0;
        lastLossSignal = null;
      } else {
        lossCount++;
        lossStreak++;
        lastLossSignal = lastPrediction.big;
      }

      historyData.unshift({
        issue: currentIssue.slice(-4),
        predicted: lastPrediction.big ? 'BIG' : 'SMALL',
        actual: actualNum,
        actualBig: actualBig ? 'BIG' : 'SMALL',
        won: won
      });
      if (historyData.length > 50) historyData.pop();
    }
  }

  lastIssue = currentIssue;

  // Generate prediction
  const prediction = analyze(list);
  if (prediction) {
    lastPrediction = prediction;
    displayPrediction(prediction);
  }

  displayHistory();
  displayStats();
  document.getElementById('status').textContent = '✅ Updated: ' + new Date().toLocaleTimeString();
}

// ---------- DISPLAY ----------
function displayPrediction(p) {
  const bigEl = document.getElementById('signalBig');
  bigEl.textContent = p.big ? 'BIG' : 'SMALL';
  bigEl.style.color = p.big ? '#ff8844' : '#44aaff';
  bigEl.classList.remove('loading');

  document.getElementById('signalNum').textContent = p.num;
  document.getElementById('signalColor').textContent = p.emoji + ' ' + p.color;
  document.getElementById('signalColor').style.color =
    p.color.includes('GREEN') ? '#00ff88' :
    p.color.includes('RED') ? '#ff4466' : '#ff00cc';

  document.getElementById('confText').textContent = p.confidence + '%';
  document.getElementById('confFill').style.width = p.confidence + '%';
}

function displayStats() {
  document.getElementById('winCount').textContent = winCount;
  document.getElementById('lossCount').textContent = lossCount;
  document.getElementById('totalCount').textContent = winCount + lossCount;
  document.getElementById('histCount').textContent = historyData.length;
}

function displayHistory() {
  const hist = document.getElementById('history');
  if (historyData.length === 0) {
    hist.innerHTML = '<div class="empty">No results yet</div>';
    return;
  }
  hist.innerHTML = historyData.map(h => `
    <div class="history-item">
      <span class="h-issue">#${h.issue}</span>
      <span class="h-pred">${h.predicted}</span>
      <span class="h-arrow">→</span>
      <span class="h-actual">${h.actual} ${h.actualBig}</span>
      <span class="h-result ${h.won ? 'win-text' : 'loss-text'}">
        ${h.won ? '✓ WIN' : '✗ LOSS'}
      </span>
    </div>
  `).join('');
}

// ---------- START ----------
setTimeout(fetchHistory, 1000);
setInterval(fetchHistory, REFRESH_MS);
</script>
</body>
</html>
