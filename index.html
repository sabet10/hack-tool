<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SABET</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0a0a0a;
    color: #fff;
    min-height: 100vh;
    padding: 14px;
    padding-bottom: 40px;
  }

  /* ===== HEADER ===== */
  .header {
    text-align: center;
    padding: 14px 10px;
    margin-bottom: 12px;
  }
  .header .name {
    font-size: 34px;
    font-weight: 900;
    letter-spacing: 8px;
    color: #00ffcc;
    text-shadow: 0 0 25px #00ffcc;
  }
  .header .sub {
    font-size: 10px;
    letter-spacing: 6px;
    color: #00ffcc66;
    margin-top: 4px;
    font-weight: 600;
  }

  /* ===== TOP BAR ===== */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #111;
    border: 1px solid #00ffcc33;
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 12px;
  }
  .top-bar .col { display: flex; flex-direction: column; }
  .top-bar .col.right { align-items: flex-end; }
  .top-bar .lbl {
    font-size: 9px;
    letter-spacing: 3px;
    color: #666;
    margin-bottom: 4px;
    font-weight: 700;
  }
  .top-bar .period {
    color: #00ffcc;
    font-weight: 900;
    font-size: 20px;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 12px #00ffcc;
    letter-spacing: 2px;
  }
  .top-bar .timer {
    color: #ffd700;
    font-weight: 900;
    font-size: 24px;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 12px #ffd700;
    letter-spacing: 2px;
  }
  .top-bar .timer.danger {
    color: #ff4466;
    text-shadow: 0 0 15px #ff4466;
  }

  /* ===== MAIN SIGNAL BOX ===== */
  .main-box {
    background: linear-gradient(145deg, #0d0d1f, #1a0033);
    border: 2px solid #00ffcc;
    border-radius: 18px;
    padding: 24px 20px;
    text-align: center;
    margin-bottom: 12px;
    box-shadow: 0 0 30px #00ffcc44, inset 0 0 20px #00ffcc08;
  }
  .signal-label {
    font-size: 11px;
    letter-spacing: 5px;
    color: #00ffcc;
    font-weight: 800;
    margin-bottom: 6px;
  }
  .signal-big {
    font-size: 60px;
    font-weight: 900;
    letter-spacing: 3px;
    margin: 8px 0;
    line-height: 1;
    transition: color 0.3s, text-shadow 0.3s;
  }
  .signal-big.big-color {
    color: #ff9d3d;
    text-shadow: 0 0 35px #ff9d3d;
  }
  .signal-big.small-color {
    color: #4fc3ff;
    text-shadow: 0 0 35px #4fc3ff;
  }
  .signal-num-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 6px 0;
  }
  .signal-num {
    font-size: 50px;
    font-weight: 900;
    color: #ffd700;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 25px #ffd700;
    line-height: 1;
  }
  .signal-emoji {
    font-size: 30px;
  }
  .signal-color {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-top: 6px;
    color: #ccc;
  }

  /* ===== ACCURACY ===== */
  .accuracy-wrap {
    margin-top: 18px;
  }
  .accuracy-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    letter-spacing: 3px;
    color: #888;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .accuracy-value {
    color: #00ffcc;
    font-size: 20px;
    font-weight: 900;
    text-shadow: 0 0 12px #00ffcc;
    font-family: 'Courier New', monospace;
  }
  .conf-bar {
    height: 10px;
    background: #000;
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid #00ffcc33;
  }
  .conf-fill {
    height: 100%;
    background: linear-gradient(90deg, #00ffcc, #00ccff);
    width: 0%;
    transition: width 0.6s ease;
    box-shadow: 0 0 12px #00ffcc;
  }

  /* ===== STATS ===== */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat-box {
    background: #111;
    padding: 14px 6px;
    border-radius: 12px;
    text-align: center;
    border: 1px solid #ffffff11;
  }
  .stat-num {
    font-size: 26px;
    font-weight: 900;
    display: block;
    font-family: 'Courier New', monospace;
    line-height: 1;
  }
  .stat-box.win .stat-num { color: #00ff88; text-shadow: 0 0 12px #00ff88; }
  .stat-box.loss .stat-num { color: #ff4466; text-shadow: 0 0 12px #ff4466; }
  .stat-box.total .stat-num { color: #ffd700; text-shadow: 0 0 12px #ffd700; }
  .stat-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: #777;
    margin-top: 6px;
    font-weight: 700;
  }

  /* ===== HISTORY ===== */
  .hist-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    padding: 0 4px;
  }
  .hist-title .txt {
    color: #00ffcc;
    font-size: 11px;
    letter-spacing: 4px;
    font-weight: 800;
  }
  .hist-title .cnt {
    background: #00ffcc22;
    color: #00ffcc;
    font-size: 12px;
    font-weight: 900;
    padding: 3px 12px;
    border-radius: 10px;
    border: 1px solid #00ffcc44;
    font-family: 'Courier New', monospace;
  }
  .history {
    max-height: 340px;
    overflow-y: auto;
    background: #0a0a15;
    border-radius: 12px;
    padding: 8px;
    border: 1px solid #ffffff0d;
  }
  .history-item {
    display: grid;
    grid-template-columns: 60px 1fr 1fr 65px;
    align-items: center;
    padding: 11px 10px;
    border-bottom: 1px solid #ffffff08;
    font-size: 12px;
    border-radius: 6px;
    margin-bottom: 3px;
    background: #0d0d1a;
  }
  .h-issue {
    color: #666;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
  }
  .h-pred {
    color: #00ccff;
    font-weight: 800;
    font-size: 12px;
  }
  .h-actual {
    color: #ffd700;
    font-weight: 800;
    font-size: 12px;
  }
  .h-result {
    text-align: right;
    font-weight: 900;
    font-size: 11px;
  }
  .win-text { color: #00ff88; text-shadow: 0 0 6px #00ff88; }
  .loss-text { color: #ff4466; text-shadow: 0 0 6px #ff4466; }

  .empty {
    text-align: center;
    color: #444;
    padding: 30px 20px;
    font-size: 12px;
    letter-spacing: 3px;
  }

  .status {
    text-align: center;
    font-size: 10px;
    color: #555;
    margin-top: 12px;
    font-family: 'Courier New', monospace;
  }

  .loading {
    color: #00ffcc;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: 3px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="name">SABET</div>
  <div class="sub">SIGNAL SYSTEM</div>
</div>

<div class="top-bar">
  <div class="col">
    <span class="lbl">NEXT PERIOD</span>
    <span class="period" id="periodNum">----</span>
  </div>
  <div class="col right">
    <span class="lbl">TIME LEFT</span>
    <span class="timer" id="timerNum">--s</span>
  </div>
</div>

<div class="main-box">
  <div class="signal-label">SIGNAL</div>
  <div id="signalBig" class="signal-big loading">WAIT...</div>
  <div class="signal-num-wrap">
    <div id="signalNum" class="signal-num">-</div>
    <div id="signalEmoji" class="signal-emoji"></div>
  </div>
  <div id="signalColor" class="signal-color">-</div>

  <div class="accuracy-wrap">
    <div class="accuracy-label">
      <span>ACCURACY</span>
      <span class="accuracy-value" id="confText">0%</span>
    </div>
    <div class="conf-bar"><div class="conf-fill" id="confFill"></div></div>
  </div>
</div>

<div class="stats">
  <div class="stat-box win">
    <span class="stat-num" id="winCount">0</span>
    <span class="stat-label">WIN</span>
  </div>
  <div class="stat-box loss">
    <span class="stat-num" id="lossCount">0</span>
    <span class="stat-label">LOSS</span>
  </div>
  <div class="stat-box total">
    <span class="stat-num" id="totalCount">0</span>
    <span class="stat-label">TOTAL</span>
  </div>
</div>

<div class="hist-title">
  <span class="txt">📊 HISTORY</span>
  <span class="cnt" id="histCount">0</span>
</div>
<div class="history" id="history">
  <div class="empty">NO RESULTS YET</div>
</div>

<div class="status" id="status">Connecting...</div>

<script>
// ---------- CONFIG ----------
const API = 'https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?ts=';
const REFRESH_MS = 3000;
const PERIOD_SECONDS = 30;

// ---------- STATE ----------
let lastIssue = null;
let lastPrediction = null;
let winCount = 0, lossCount = 0;
let historyData = [];
let lastLossSignal = null;
let lossStreak = 0;
let periodEndTime = 0;
let lastPredictedNum = null;
let lastPredictedBig = null;

// ---------- COLOR MAP ----------
const COLOR_MAP = {
  0: { color: 'RED+VIOLET',   emoji: '🔴🟣', type: 'SMALL' },
  1: { color: 'GREEN',        emoji: '🟢',    type: 'SMALL' },
  2: { color: 'RED',          emoji: '🔴',    type: 'SMALL' },
  3: { color: 'GREEN',        emoji: '🟢',    type: 'SMALL' },
  4: { color: 'RED',          emoji: '🔴',    type: 'SMALL' },
  5: { color: 'GREEN+VIOLET', emoji: '🟢🟣', type: 'BIG' },
  6: { color: 'RED',          emoji: '🔴',    type: 'BIG' },
  7: { color: 'GREEN',        emoji: '🟢',    type: 'BIG' },
  8: { color: 'RED',          emoji: '🔴',    type: 'BIG' },
  9: { color: 'GREEN',        emoji: '🟢',    type: 'BIG' }
};

// ---------- TIMER ----------
function updateTimer() {
  if (!periodEndTime) return;
  const now = Date.now();
  let remain = Math.ceil((periodEndTime - now) / 1000);
  if (remain < 0) remain = 0;
  const el = document.getElementById('timerNum');
  el.textContent = remain + 's';
  if (remain <= 5) el.classList.add('danger');
  else el.classList.remove('danger');
}
setInterval(updateTimer, 250);

// ---------- ANALYSIS ----------
function analyze(list) {
  if (!list || list.length < 8) return null;

  const recent = list.slice(0, 20).map(x => ({
    num: parseInt(x.number),
    big: parseInt(x.number) >= 5,
    color: x.color
  }));

  let bigCount = 0, smallCount = 0;
  recent.forEach(r => r.big ? bigCount++ : smallCount++);

  let currentStreak = 1;
  for (let i = 1; i < recent.length; i++) {
    if (recent[i].big === recent[0].big) currentStreak++;
    else break;
  }

  const last5 = recent.slice(0, 5).map(r => r.big ? 'B' : 'S').join('');
  const last6 = recent.slice(0, 6).map(r => r.big ? 'B' : 'S').join('');
  const last8 = recent.slice(0, 8).map(r => r.big ? 'B' : 'S').join('');

  // Number frequency
  const freq = {};
  for (let i = 0; i <= 9; i++) freq[i] = 0;
  recent.forEach(r => freq[r.num]++);

  // Sort by least frequency
  let candidateNums = [];
  for (let i = 0; i <= 9; i++) candidateNums.push({ num: i, count: freq[i] });
  candidateNums.sort((a, b) => a.count - b.count);

  // ---------- PREDICTION ----------
  let predictBig;
  let reason = '';

  // Loss recovery: flip direction
  if (lossStreak >= 1 && lastLossSignal !== null) {
    predictBig = !lastLossSignal;
    reason = 'recovery';
  }
  // Long streak break
  else if (currentStreak >= 6) {
    predictBig = !recent[0].big;
    reason = 'streak-break';
  }
  // Alternating
  else if (last5 === 'BSBSB' || last5 === 'SBSBS') {
    predictBig = !recent[0].big;
    reason = 'alternate';
  }
  // Pattern
  else if (last6 === 'BBSSBB' || last6 === 'SSBBSS') {
    predictBig = !recent[0].big;
    reason = 'pattern';
  }
  // Imbalance
  else if (bigCount > smallCount + 4) {
    predictBig = false;
    reason = 'imbalance';
  }
  else if (smallCount > bigCount + 4) {
    predictBig = true;
    reason = 'imbalance';
  }
  // Streak follow (3-5)
  else if (currentStreak >= 3) {
    predictBig = Math.random() < 0.5 ? recent[0].big : !recent[0].big;
    reason = 'streak';
  }
  else {
    predictBig = Math.random() > 0.5;
    reason = 'random';
  }

  // Force different number if same as last time (prevent repeat)
  const targetType = predictBig ? 'BIG' : 'SMALL';
  const validNums = candidateNums.filter(c => COLOR_MAP[c.num].type === targetType);

  let predictNum;
  if (validNums.length > 0) {
    // Skip last predicted number if possible
    const filtered = validNums.filter(c => c.num !== lastPredictedNum);
    predictNum = (filtered.length > 0 ? filtered[0] : validNums[0]).num;
  } else {
    predictNum = predictBig ? 7 : 2;
  }

  // If same Big/Small as last prediction AND same reason → force change
  if (predictBig === lastPredictedBig && reason === 'random' && validNums.length > 1) {
    predictNum = validNums[1].num;
  }

  // Confidence
  let conf = 60;
  if (currentStreak >= 6) conf += 20;
  else if (currentStreak >= 4) conf += 12;
  else if (currentStreak >= 3) conf += 6;
  if (Math.abs(bigCount - smallCount) > 4) conf += 10;
  if (reason === 'recovery') conf += 8;
  if (reason === 'alternate') conf += 5;
  conf = Math.min(conf, 92);

  return {
    big: predictBig,
    num: predictNum,
    color: COLOR_MAP[predictNum].color,
    emoji: COLOR_MAP[predictNum].emoji,
    confidence: Math.round(conf),
    reason: reason,
    streak: currentStreak
  };
}

// ---------- FETCH ----------
async function fetchHistory() {
  try {
    const res = await fetch(API + Date.now());
    const json = await res.json();
    if (json && json.data && json.data.list) {
      processData(json.data.list);
    } else {
      document.getElementById('status').textContent = 'No data received';
    }
  } catch (e) {
    document.getElementById('status').textContent = 'Connection error — retrying...';
  }
}

// ---------- PROCESS ----------
function processData(list) {
  if (!list || list.length === 0) return;
  const latest = list[0];
  const currentIssue = latest.issueNumber;

  // Check if new period
  const isNewPeriod = (lastIssue !== null && lastIssue !== currentIssue);

  if (isNewPeriod) {
    // New period - reset timer
    periodEndTime = Date.now() + (PERIOD_SECONDS * 1000);

    // Check last prediction result
    if (lastPrediction) {
      const actualNum = parseInt(latest.number);
      const actualBig = actualNum >= 5;
      const won = (actualBig === lastPrediction.big);

      if (won) {
        winCount++;
        lossStreak = 0;
        lastLossSignal = null;
      } else {
        lossCount++;
        lossStreak++;
        lastLossSignal = lastPrediction.big;
      }

      historyData.unshift({
        issue: currentIssue.slice(-4),
        predicted: lastPrediction.big ? 'BIG' : 'SMALL',
        actual: actualNum,
        actualBig: actualBig ? 'BIG' : 'SMALL',
        won: won
      });
      if (historyData.length > 50) historyData.pop();
    }

    lastIssue = currentIssue;

    // Generate new prediction
    const prediction = analyze(list);
    if (prediction) {
      lastPrediction = prediction;
      lastPredictedNum = prediction.num;
      lastPredictedBig = prediction.big;
      displayPrediction(prediction);
    }

    displayHistory();
    displayStats();
  } else if (lastIssue === null) {
    // First time
    lastIssue = currentIssue;
    periodEndTime = Date.now() + (PERIOD_SECONDS * 1000);

    const prediction = analyze(list);
    if (prediction) {
      lastPrediction = prediction;
      lastPredictedNum = prediction.num;
      lastPredictedBig = prediction.big;
      displayPrediction(prediction);
    }
    displayHistory();
    displayStats();
  }

  // Update NEXT PERIOD number
  const issueNum = parseInt(currentIssue);
  const nextPeriod = (issueNum + 1).toString();
  document.getElementById('periodNum').textContent = nextPeriod.slice(-4);

  document.getElementById('status').textContent = '✓ Updated: ' + new Date().toLocaleTimeString();
}

// ---------- DISPLAY ----------
function displayPrediction(p) {
  const bigEl = document.getElementById('signalBig');
  bigEl.textContent = p.big ? 'BIG' : 'SMALL';
  bigEl.className = 'signal-big ' + (p.big ? 'big-color' : 'small-color');

  document.getElementById('signalNum').textContent = p.num;
  document.getElementById('signalEmoji').textContent = p.emoji;
  document.getElementById('signalColor').textContent = p.color;

  document.getElementById('confText').textContent = p.confidence + '%';
  document.getElementById('confFill').style.width = p.confidence + '%';
}

function displayStats() {
  document.getElementById('winCount').textContent = winCount;
  document.getElementById('lossCount').textContent = lossCount;
  document.getElementById('totalCount').textContent = winCount + lossCount;
  document.getElementById('histCount').textContent = historyData.length;
}

function displayHistory() {
  const hist = document.getElementById('history');
  if (historyData.length === 0) {
    hist.innerHTML = '<div class="empty">NO RESULTS YET</div>';
    return;
  }
  hist.innerHTML = historyData.map(h => `
    <div class="history-item">
      <span class="h-issue">#${h.issue}</span>
      <span class="h-pred">${h.predicted}</span>
      <span class="h-actual">${h.actual} ${h.actualBig}</span>
      <span class="h-result ${h.won ? 'win-text' : 'loss-text'}">
        ${h.won ? '✓ WIN' : '✗ LOSS'}
      </span>
    </div>
  `).join('');
}

// ---------- START ----------
setTimeout(fetchHistory, 800);
setInterval(fetchHistory, REFRESH_MS);
</script>
</body>
     </html>
