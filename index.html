<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DK Win Hack Signal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: radial-gradient(circle at top, #1a0033, #000);
    color: #fff;
    min-height: 100vh;
    padding: 12px;
  }
  .header {
    text-align: center;
    padding: 14px;
    background: linear-gradient(90deg, #ff00cc, #00ffcc);
    color: #000;
    border-radius: 14px;
    font-weight: bold;
    font-size: 22px;
    margin-bottom: 10px;
    box-shadow: 0 0 30px #ff00cc88;
    letter-spacing: 2px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #111;
    border: 1px solid #00ffcc55;
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .top-bar .period {
    color: #00ffcc;
    font-weight: bold;
  }
  .top-bar .timer {
    color: #ffd700;
    font-weight: bold;
    font-size: 16px;
  }
  .main-box {
    background: linear-gradient(145deg, #0d0d1f, #1a0033);
    border: 2px solid #00ffcc;
    border-radius: 18px;
    padding: 22px;
    text-align: center;
    box-shadow: 0 0 30px #00ffcc55, inset 0 0 20px #00ffcc11;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
  }
  .main-box::before {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(from 0deg, transparent, #00ffcc33, transparent, #ff00cc33, transparent);
    animation: rotate 6s linear infinite;
    z-index: 0;
  }
  @keyframes rotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .main-box > * { position: relative; z-index: 1; }
  .label {
    font-size: 12px;
    color: #ff00cc;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: bold;
  }
  .signal-big {
    font-size: 56px;
    font-weight: 900;
    margin: 8px 0;
    text-shadow: 0 0 25px currentColor;
    letter-spacing: 2px;
  }
  .signal-num {
    font-size: 44px;
    font-weight: 900;
    color: #ffd700;
    margin: 4px 0;
    text-shadow: 0 0 20px #ffd700;
  }
  .signal-color {
    font-size: 18px;
    margin-top: 6px;
    font-weight: bold;
  }
  .confidence {
    margin-top: 14px;
    font-size: 13px;
    color: #ccc;
  }
  .conf-bar {
    height: 10px;
    background: #222;
    border-radius: 5px;
    margin-top: 8px;
    overflow: hidden;
    border: 1px solid #333;
  }
  .conf-fill {
    height: 100%;
    background: linear-gradient(90deg, #00ffcc, #ff00cc);
    width: 0%;
    transition: width 0.6s;
    box-shadow: 0 0 10px #00ffcc;
  }
  .stats {
    display: flex;
    justify-content: space-around;
    margin: 12px 0;
    gap: 8px;
  }
  .stat-box {
    flex: 1;
    background: linear-gradient(145deg, #0d0d1f, #1a0033);
    padding: 12px 8px;
    border-radius: 12px;
    border: 1px solid #00ffcc44;
    text-align: center;
    box-shadow: 0 0 10px #00ffcc22;
  }
  .stat-num {
    font-size: 24px;
    font-weight: 900;
    display: block;
    text-shadow: 0 0 10px currentColor;
  }
  .stat-label {
    font-size: 11px;
    color: #aaa;
    letter-spacing: 1px;
  }
  .win .stat-num { color: #00ff88; }
  .loss .stat-num { color: #ff4466; }
  .total .stat-num { color: #ffd700; }
  .section-title {
    color: #00ffcc;
    font-size: 13px;
    margin: 14px 0 8px;
    letter-spacing: 2px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .section-title .count {
    color: #ffd700;
    font-size: 12px;
  }
  .history {
    max-height: 320px;
    overflow-y: auto;
    background: linear-gradient(145deg, #050510, #0d0d1f);
    border-radius: 12px;
    padding: 8px;
    border: 1px solid #00ffcc33;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px;
    border-bottom: 1px solid #1a1a2e;
    font-size: 12px;
    border-radius: 6px;
    margin-bottom: 4px;
  }
  .history-item:last-child { border-bottom: none; }
  .h-issue { color: #888; font-size: 11px; }
  .h-pred { color: #00ccff; }
  .h-actual { color: #ffd700; }
  .h-result { font-weight: bold; }
  .win-text { color: #00ff88; }
  .loss-text { color: #ff4466; }
  .status {
    text-align: center;
    font-size: 11px;
    color: #666;
    margin-top: 8px;
  }
  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .btn-refresh {
    background: linear-gradient(90deg, #00ffcc, #00ccff);
    color: #000;
  }
  .btn-stop {
    background: linear-gradient(90deg, #ff4466, #ff00cc);
    color: #fff;
  }
  .btn-start {
    background: linear-gradient(90deg, #00ff88, #00ffcc);
    color: #000;
  }
  .loading {
    color: #00ffcc;
    font-size: 16px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .empty {
    text-align: center;
    color: #555;
    padding: 20px;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="header">⚡ DK WIN HACK ⚡</div>

<div class="top-bar">
  <div>PERIOD: <span class="period" id="periodNum">----</span></div>
  <div>TIME: <span class="timer" id="timerNum">--s</span></div>
</div>

<div class="main-box">
  <div class="label">SIGNAL</div>
  <div id="signalBig" class="signal-big loading">LOADING...</div>
  <div id="signalNum" class="signal-num">-</div>
  <div id="signalColor" class="signal-color">-</div>
  <div class="confidence" id="confText">Confidence: 0%</div>
  <div class="conf-bar"><div class="conf-fill" id="confFill"></div></div>
</div>

<div class="stats">
  <div class="stat-box win">
    <span class="stat-num" id="winCount">0</span>
    <span class="stat-label">WIN</span>
  </div>
  <div class="stat-box loss">
    <span class="stat-num" id="lossCount">0</span>
    <span class="stat-label">LOSS</span>
  </div>
  <div class="stat-box total">
    <span class="stat-num" id="totalCount">0</span>
    <span class="stat-label">TOTAL</span>
  </div>
</div>

<div class="section-title">
  <span>📊 HISTORY</span>
  <span class="count" id="histCount">0</span>
</div>
<div class="history" id="history">
  <div class="empty">No results yet</div>
</div>

<div class="btn-row">
  <button class="btn btn-refresh" id="refreshBtn" onclick="manualRefresh()">🔄 REFRESH</button>
  <button class="btn btn-stop" id="stopBtn" onclick="toggleStop()">⏸ STOP</button>
</div>

<div class="status" id="status">Connecting...</div>

<script>
// ---------- CONFIG ----------
const API = 'https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?ts=';
const REFRESH_MS = 30000;
const PERIOD_SECONDS = 30;

// ---------- STATE ----------
let lastIssue = null;
let lastPrediction = null;
let winCount = 0, lossCount = 0;
let historyData = [];
let recentResults = [];
let running = true;
let lastFetchTime = 0;
let periodEndTime = 0;
let lastLossSignal = null;
let lossStreak = 0;

// ---------- COLOR MAP ----------
const COLOR_MAP = {
  0: { color: 'RED+VIOLET', emoji: '🔴🟣', type: 'SMALL' },
  1: { color: 'GREEN',      emoji: '🟢',    type: 'SMALL' },
  2: { color: 'RED',        emoji: '🔴',    type: 'SMALL' },
  3: { color: 'GREEN',      emoji: '🟢',    type: 'SMALL' },
  4: { color: 'RED',        emoji: '🔴',    type: 'SMALL' },
  5: { color: 'GREEN+VIOLET', emoji: '🟢🟣', type: 'BIG' },
  6: { color: 'RED',        emoji: '🔴',    type: 'BIG' },
  7: { color: 'GREEN',      emoji: '🟢',    type: 'BIG' },
  8: { color: 'RED',        emoji: '🔴',    type: 'BIG' },
  9: { color: 'GREEN',      emoji: '🟢',    type: 'BIG' }
};

// ---------- TIMER ----------
function updateTimer() {
  if (!periodEndTime) return;
  const now = Date.now();
  let remain = Math.ceil((periodEndTime - now) / 1000);
  if (remain < 0) remain = 0;
  document.getElementById('timerNum').textContent = remain + 's';
  if (remain <= 5) {
    document.getElementById('timerNum').style.color = '#ff4466';
  } else {
    document.getElementById('timerNum').style.color = '#ffd700';
  }
}
setInterval(updateTimer, 500);

// ---------- ANALYSIS (IMPROVED) ----------
function analyze(list) {
  if (!list || list.length < 10) return null;

  const recent = list.slice(0, 30).map(x => ({
    num: parseInt(x.number),
    big: parseInt(x.number) >= 5,
    color: x.color
  }));

  // Big/Small counts
  let bigCount = 0, smallCount = 0;
  recent.slice(0, 20).forEach(r => r.big ? bigCount++ : smallCount++);

  // Current streak
  let currentStreak = 1;
  for (let i = 1; i < recent.length; i++) {
    if (recent[i].big === recent[0].big) currentStreak++;
    else break;
  }

  // Last 5 pattern
  const last5 = recent.slice(0, 5).map(r => r.big ? 'B' : 'S').join('');
  const last10 = recent.slice(0, 10).map(r => r.big ? 'B' : 'S').join('');

  // Number frequency
  const freq = {};
  for (let i = 0; i <= 9; i++) freq[i] = 0;
  recent.forEach(r => freq[r.num]++);

  // Sort by least frequent
  let candidateNums = [];
  for (let i = 0; i <= 9; i++) candidateNums.push({ num: i, count: freq[i] });
  candidateNums.sort((a, b) => a.count - b.count);

  // ---------- PREDICTION LOGIC ----------
  let predictBig;

  // Loss recovery: if last was loss, FLIP signal
  if (lastLossSignal !== null && lossStreak > 0) {
    predictBig = !lastLossSignal;
  }
  // Long streak = break
  else if (currentStreak >= 5) {
    predictBig = !recent[0].big;
  }
  else if (currentStreak >= 3) {
    // 3+ streak → 60% chance to continue, 40% break
    predictBig = Math.random() < 0.4 ? !recent[0].big : recent[0].big;
  }
  else if (bigCount > smallCount + 4) {
    predictBig = false;
  }
  else if (smallCount > bigCount + 4) {
    predictBig = true;
  }
  // Pattern detection
  else if (last5 === 'BSBSB' || last5 === 'SBSBS') {
    predictBig = !recent[0].big;
  }
  else {
    predictBig = Math.random() > 0.5;
  }

  // Number prediction - pick least frequent matching type
  const targetType = predictBig ? 'BIG' : 'SMALL';
  const validNums = candidateNums.filter(c => COLOR_MAP[c.num].type === targetType);
  let predictNum;
  if (validNums.length > 0) {
    predictNum = validNums[0].num;
  } else {
    predictNum = predictBig ? 7 : 2;
  }

  // Confidence
  let conf = 60;
  if (currentStreak >= 5) conf += 15;
  else if (currentStreak >= 3) conf += 8;
  if (Math.abs(bigCount - smallCount) > 4) conf += 10;
  if (lossStreak > 0) conf += 5;
  conf = Math.min(conf, 92);

  return {
    big: predictBig,
    num: predictNum,
    color: COLOR_MAP[predictNum].color,
    emoji: COLOR_MAP[predictNum].emoji,
    confidence: Math.round(conf),
    streak: currentStreak
  };
}

// ---------- FETCH ----------
async function fetchHistory() {
  if (!running) return;
  try {
    document.getElementById('status').textContent = 'Fetching data...';
    const res = await fetch(API + Date.now());
    const json = await res.json();
    if (json && json.data && json.data.list) {
      lastFetchTime = Date.now();
      processData(json.data.list);
    } else {
      document.getElementById('status').textContent = 'No data received';
    }
  } catch (e) {
    document.getElementById('status').textContent = 'Connection failed — retrying...';
  }
}

// ---------- PROCESS ----------
function processData(list) {
  if (!list || list.length === 0) return;
  const latest = list[0];

  // New round detection
  if (lastIssue && lastIssue !== latest.issueNumber) {
    if (lastPrediction) {
      const actualNum = parseInt(latest.number);
      const actualBig = actualNum >= 5;
      const won = (actualBig === lastPrediction.big);

      if (won) {
        winCount++;
        lossStreak = 0;
        lastLossSignal = null;
      } else {
        lossCount++;
        lossStreak++;
        lastLossSignal = lastPrediction.big;
      }

      historyData.unshift({
        issue: latest.issueNumber.slice(-4),
        predicted: lastPrediction.big ? 'BIG' : 'SMALL',
        actual: actualNum,
        actualBig: actualBig ? 'BIG' : 'SMALL',
        won: won
      });
      if (historyData.length > 50) historyData.pop();
    }
  }

  lastIssue = latest.issueNumber;
  document.getElementById('periodNum').textContent = latest.issueNumber.slice(-4);

  // Timer calculation - next period
  periodEndTime = lastFetchTime + (PERIOD_SECONDS * 1000);

  // Generate prediction
  const prediction = analyze(list);
  if (prediction) {
    lastPrediction = prediction;
    displayPrediction(prediction);
  }

  displayHistory();
  displayStats();
  document.getElementById('status').textContent = '✅ Updated: ' + new Date().toLocaleTimeString();
}

// ---------- DISPLAY ----------
function displayPrediction(p) {
  const bigEl = document.getElementById('signalBig');
  bigEl.textContent = p.big ? 'BIG' : 'SMALL';
  bigEl.style.color = p.big ? '#ff8844' : '#44aaff';
  bigEl.classList.remove('loading');

  document.getElementById('signalNum').textContent = p.num;
  document.getElementById('signalColor').textContent = p.emoji + ' ' + p.color;
  document.getElementById('signalColor').style.color = 
    p.color.includes('GREEN') ? '#00ff88' : 
    p.color.includes('RED') ? '#ff4466' : '#ff00cc';

  document.getElementById('confText').textContent = 'Confidence: ' + p.confidence + '%';
  document.getElementById('confFill').style.width = p.confidence + '%';
}

function displayStats() {
  document.getElementById('winCount').textContent = winCount;
  document.getElementById('lossCount').textContent = lossCount;
  document.getElementById('totalCount').textContent = winCount + lossCount;
  document.getElementById('histCount').textContent = historyData.length;
}

function displayHistory() {
  const hist = document.getElementById('history');
  if (historyData.length === 0) {
    hist.innerHTML = '<div class="empty">No results yet</div>';
    return;
  }
  hist.innerHTML = historyData.map(h => `
    <div class="history-item">
      <span class="h-issue">#${h.issue}</span>
      <span class="h-pred">${h.predicted}</span>
      <span class="h-actual">→ ${h.actual} ${h.actualBig}</span>
      <span class="h-result ${h.won ? 'win-text' : 'loss-text'}">
        ${h.won ? '✓ WIN' : '✗ LOSS'}
      </span>
    </div>
  `).join('');
}

function manualRefresh() {
  fetchHistory();
}

function toggleStop() {
  running = !running;
  const btn = document.getElementById('stopBtn');
  if (running) {
    btn.textContent = '⏸ STOP';
    btn.className = 'btn btn-stop';
    document.getElementById('status').textContent = 'Resumed';
    fetchHistory();
  } else {
    btn.textContent = '▶ START';
    btn.className = 'btn btn-start';
    document.getElementById('status').textContent = 'Paused';
  }
}

// ---------- START ----------
setTimeout(fetchHistory, 1500);
setInterval(() => {
  if (running) fetchHistory();
}, REFRESH_MS);
</script>
</body>
</html>
