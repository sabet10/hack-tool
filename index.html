<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SABET</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0a0a0a;
    background-image:
      radial-gradient(circle at 20% 10%, #1a003366 0%, transparent 50%),
      radial-gradient(circle at 80% 90%, #00336666 0%, transparent 50%);
    color: #fff;
    min-height: 100vh;
    padding: 14px;
    padding-bottom: 40px;
  }

  /* ===== HEADER ===== */
  .header {
    text-align: center;
    padding: 18px 10px;
    margin-bottom: 14px;
    position: relative;
  }
  .header .name {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(90deg, #00ffe0, #00b3ff, #b300ff, #ff00c8);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: gradientMove 4s ease infinite;
    text-shadow: 0 0 40px #00ffe055;
  }
  .header .sub {
    font-size: 10px;
    letter-spacing: 6px;
    color: #00ffe088;
    margin-top: 4px;
    font-weight: 600;
  }
  @keyframes gradientMove {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* ===== TOP BAR ===== */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(135deg, #10101c, #1a1a2e);
    border: 1px solid #00ffe033;
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 14px;
    box-shadow: 0 0 20px #00ffe015;
  }
  .top-bar .col {
    display: flex;
    flex-direction: column;
  }
  .top-bar .col.right { align-items: flex-end; }
  .top-bar .lbl {
    font-size: 9px;
    letter-spacing: 3px;
    color: #666;
    margin-bottom: 4px;
    font-weight: 700;
  }
  .top-bar .period {
    color: #00ffe0;
    font-weight: 900;
    font-size: 22px;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 15px #00ffe0;
    letter-spacing: 2px;
  }
  .top-bar .timer {
    color: #ffd700;
    font-weight: 900;
    font-size: 26px;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 15px #ffd700;
    letter-spacing: 2px;
    transition: color 0.3s;
  }
  .top-bar .timer.danger {
    color: #ff3366;
    text-shadow: 0 0 20px #ff3366;
    animation: blink 0.5s infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  /* ===== MAIN SIGNAL BOX ===== */
  .main-box {
    position: relative;
    background: linear-gradient(160deg, #0d0d1a, #14142a, #0d0d1a);
    border-radius: 22px;
    padding: 28px 20px 24px;
    text-align: center;
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: 0 0 40px #00ffe022, inset 0 0 30px #00ffe008;
  }
  .main-box::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 22px;
    padding: 2px;
    background: linear-gradient(135deg, #00ffe0, #ff00c8, #00ffe0);
    background-size: 300% 300%;
    animation: borderFlow 6s linear infinite;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: 0;
  }
  @keyframes borderFlow {
    0% { background-position: 0% 0%; }
    100% { background-position: 300% 300%; }
  }
  .main-box > * { position: relative; z-index: 2; }

  .signal-label {
    font-size: 10px;
    letter-spacing: 6px;
    color: #00ffe0;
    font-weight: 800;
    margin-bottom: 8px;
    text-shadow: 0 0 10px #00ffe0;
  }
  .signal-big {
    font-size: 64px;
    font-weight: 900;
    letter-spacing: 4px;
    margin: 8px 0;
    line-height: 1;
    transition: all 0.4s;
  }
  .signal-big.big-color {
    color: #ff9d3d;
    text-shadow: 0 0 40px #ff9d3d, 0 0 80px #ff9d3d55;
    animation: glowOrange 2s ease-in-out infinite alternate;
  }
  .signal-big.small-color {
    color: #4fc3ff;
    text-shadow: 0 0 40px #4fc3ff, 0 0 80px #4fc3ff55;
    animation: glowBlue 2s ease-in-out infinite alternate;
  }
  @keyframes glowOrange {
    from { text-shadow: 0 0 30px #ff9d3d, 0 0 60px #ff9d3d44; }
    to { text-shadow: 0 0 50px #ff9d3d, 0 0 90px #ff9d3d66; }
  }
  @keyframes glowBlue {
    from { text-shadow: 0 0 30px #4fc3ff, 0 0 60px #4fc3ff44; }
    to { text-shadow: 0 0 50px #4fc3ff, 0 0 90px #4fc3ff66; }
  }
  .signal-num-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin: 8px 0;
  }
  .signal-num {
    font-size: 54px;
    font-weight: 900;
    color: #ffd700;
    font-family: 'Courier New', monospace;
    text-shadow: 0 0 30px #ffd700;
    line-height: 1;
  }
  .signal-emoji {
    font-size: 32px;
    filter: drop-shadow(0 0 10px currentColor);
  }
  .signal-color {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-top: 6px;
    color: #ccc;
  }

  /* ===== ACCURACY ===== */
  .accuracy-wrap {
    margin-top: 20px;
  }
  .accuracy-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    letter-spacing: 3px;
    color: #888;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .accuracy-value {
    color: #00ffe0;
    font-size: 22px;
    font-weight: 900;
    text-shadow: 0 0 15px #00ffe0;
    font-family: 'Courier New', monospace;
  }
  .conf-bar {
    height: 10px;
    background: #0a0a12;
    border-radius: 5px;
    overflow: hidden;
    border: 1px solid #00ffe033;
    box-shadow: inset 0 0 10px #000;
  }
  .conf-fill {
    height: 100%;
    background: linear-gradient(90deg, #00ffe0, #00b3ff, #b300ff);
    background-size: 200% 100%;
    width: 0%;
    transition: width 0.7s ease;
    box-shadow: 0 0 15px #00ffe0;
    animation: fillFlow 3s linear infinite;
  }
  @keyframes fillFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 200% 50%; }
  }

  /* ===== STATS ===== */
  .stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .stat-box {
    background: linear-gradient(145deg, #10101c, #1a1a2e);
    padding: 14px 6px;
    border-radius: 14px;
    text-align: center;
    border: 1px solid #ffffff11;
    position: relative;
    overflow: hidden;
  }
  .stat-box::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
  }
  .stat-box.win::after { background: #00ff88; box-shadow: 0 0 10px #00ff88; }
  .stat-box.loss::after { background: #ff3366; box-shadow: 0 0 10px #ff3366; }
  .stat-box.total::after { background: #ffd700; box-shadow: 0 0 10px #ffd700; }

  .stat-num {
    font-size: 26px;
    font-weight: 900;
    display: block;
    font-family: 'Courier New', monospace;
    line-height: 1;
  }
  .stat-box.win .stat-num { color: #00ff88; text-shadow: 0 0 12px #00ff88; }
  .stat-box.loss .stat-num { color: #ff3366; text-shadow: 0 0 12px #ff3366; }
  .stat-box.total .stat-num { color: #ffd700; text-shadow: 0 0 12px #ffd700; }
  .stat-label {
    font-size: 9px;
    letter-spacing: 2px;
    color: #777;
    margin-top: 6px;
    font-weight: 700;
  }

  /* ===== HISTORY ===== */
  .hist-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    padding: 0 4px;
  }
  .hist-title .txt {
    color: #00ffe0;
    font-size: 11px;
    letter-spacing: 4px;
    font-weight: 800;
  }
  .hist-title .cnt {
    background: #00ffe022;
    color: #00ffe0;
    font-size: 12px;
    font-weight: 900;
    padding: 4px 12px;
    border-radius: 10px;
    border: 1px solid #00ffe044;
    font-family: 'Courier New', monospace;
  }
  .history {
    max-height: 340px;
    overflow-y: auto;
    background: #08080f;
    border-radius: 14px;
    padding: 8px;
    border: 1px solid #ffffff0d;
  }
  .history::-webkit-scrollbar { width: 4px; }
  .history::-webkit-scrollbar-thumb { background: #00ffe044; border-radius: 2px; }

  .history-item {
    display: grid;
    grid-template-columns: 60px 1fr 1fr 70px;
    align-items: center;
    padding: 12px 10px;
    border-bottom: 1px solid #ffffff08;
    font-size: 12px;
    border-radius: 8px;
    margin-bottom: 3px;
    background: linear-gradient(90deg, #0d0d1a, #0a0a15);
    transition: transform 0.2s;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .history-item:last-child { border-bottom: none; }
  .h-issue {
    color: #555;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    font-weight: 700;
  }
  .h-pred {
    color: #00c8ff;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .h-actual {
    color: #ffd700;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 1px;
  }
  .h-result {
    text-align: right;
    font-weight: 900;
    font-size: 11px;
    letter-spacing: 1px;
  }
  .win-text { color: #00ff88; text-shadow: 0 0 8px #00ff88; }
  .loss-text { color: #ff3366; text-shadow: 0 0 8px #ff3366; }

  .empty {
    text-align: center;
    color: #444;
    padding: 30px 20px;
    font-size: 12px;
    letter-spacing: 3px;
  }

  /* ===== STATUS ===== */
  .status {
    text-align: center;
    font-size: 10px;
    color: #555;
    margin-top: 14px;
    letter-spacing: 1px;
    font-family: 'Courier New', monospace;
  }

  .loading {
    color: #00ffe0;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 3px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="name">SABET</div>
  <div class="sub">SIGNAL SYSTEM</div>
</div>

<div class="top-bar">
  <div class="col">
    <span class="lbl">NEXT PERIOD</span>
    <span class="period" id="periodNum">----</span>
  </div>
  <div class="col right">
    <span class="lbl">TIME LEFT</span>
    <span class="timer" id="timerNum">--s</span>
  </div>
</div>

<div class="main-box">
  <div class="signal-label">SIGNAL</div>
  <div id="signalBig" class="signal-big loading">WAIT...</div>
  <div class="signal-num-wrap">
    <div id="signalNum" class="signal-num">-</div>
    <div id="signalEmoji" class="signal-emoji"></div>
  </div>
  <div id="signalColor" class="signal-color">-</div>

  <div class="accuracy-wrap">
    <div class="accuracy-label">
      <span>ACCURACY</span>
      <span class="accuracy-value" id="confText">0%</span>
    </div>
    <div class="conf-bar"><div class="conf-fill" id="confFill"></div></div>
  </div>
</div>

<div class="stats">
  <div class="stat-box win">
    <span class="stat-num" id="winCount">0</span>
    <span class="stat-label">WIN</span>
  </div>
  <div class="stat-box loss">
    <span class="stat-num" id="lossCount">0</span>
    <span class="stat-label">LOSS</span>
  </div>
  <div class="stat-box total">
    <span class="stat-num" id="totalCount">0</span>
    <span class="stat-label">TOTAL</span>
  </div>
</div>

<div class="hist-title">
  <span class="txt">📊 HISTORY</span>
  <span class="cnt" id="histCount">0</span>
</div>
<div class="history" id="history">
  <div class="empty">NO RESULTS YET</div>
</div>

<div class="status" id="status">Connecting...</div>

<script>
// ---------- CONFIG ----------
const API = 'https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json?ts=';
const REFRESH_MS = 5000;
const PERIOD_SECONDS = 30;

// ---------- STATE ----------
let lastIssue = null;
let lastPrediction = null;
let winCount = 0, lossCount = 0;
let historyData = [];
let lastLossSignal = null;
let lossStreak = 0;
let periodEndTime = 0;
let fetchOffset = 0;

// ---------- COLOR MAP ----------
const COLOR_MAP = {
  0: { color: 'RED+VIOLET',   emoji: '🔴🟣', type: 'SMALL' },
  1: { color: 'GREEN',        emoji: '🟢',    type: 'SMALL' },
  2: { color: 'RED',          emoji: '🔴',    type: 'SMALL' },
  3: { color: 'GREEN',        emoji: '🟢',    type: 'SMALL' },
  4: { color: 'RED',          emoji: '🔴',    type: 'SMALL' },
  5: { color: 'GREEN+VIOLET', emoji: '🟢🟣', type: 'BIG' },
  6: { color: 'RED',          emoji: '🔴',    type: 'BIG' },
  7: { color: 'GREEN',        emoji: '🟢',    type: 'BIG' },
  8: { color: 'RED',          emoji: '🔴',    type: 'BIG' },
  9: { color: 'GREEN',        emoji: '🟢',    type: 'BIG' }
};

// ---------- TIMER ----------
function updateTimer() {
  if (!periodEndTime) return;
  const now = Date.now();
  let remain = Math.ceil((periodEndTime - now) / 1000);
  if (remain < 0) remain = 0;
  const el = document.getElementById('timerNum');
  el.textContent = remain + 's';
  if (remain <= 5) {
    el.classList.add('danger');
  } else {
    el.classList.remove('danger');
  }
}
setInterval(updateTimer, 300);

// ---------- ANALYSIS ----------
function analyze(list) {
  if (!list || list.length < 5) return null;

  const recent = list.slice(0, 15).map(x => ({
    num: parseInt(x.number),
    big: parseInt(x.number) >= 5,
    color: x.color
  }));

  let bigCount = 0, smallCount = 0;
  recent.forEach(r => r.big ? bigCount++ : smallCount++);

  let currentStreak = 1;
  for (let i = 1; i < recent.length; i++) {
    if (recent[i].big === recent[0].big) currentStreak++;
    else break;
  }

  const last5 = recent.slice(0, 5).map(r => r.big ? 'B' : 'S').join('');
  const last6 = recent.slice(0, 6).map(r => r.big ? 'B' : 'S').join('');

  const freq = {};
  for (let i = 0; i <= 9; i++) freq[i] = 0;
  recent.forEach(r => freq[r.num]++);

  let candidateNums = [];
  for (let i = 0; i <= 9; i++) candidateNums.push({ num: i, count: freq[i] });
  candidateNums.sort((a, b) => a.count - b.count);

  let predictBig;
  let reason = '';

  if (lossStreak >= 1 && lastLossSignal !== null) {
    predictBig = !lastLossSignal;
    reason = 'recovery';
  } else if (currentStreak >= 5) {
    predictBig = !recent[0].big;
    reason = 'streak-break';
  } else if (last5 === 'BSBSB' || last5 === 'SBSBS') {
    predictBig = !recent[0].big;
    reason = 'alternate';
  } else if (last6 === 'BBSSBB' || last6 === 'SSBBSS') {
    predictBig = !recent[0].big;
    reason = 'pattern';
  } else if (bigCount > smallCount + 3) {
    predictBig = false;
    reason = 'imbalance';
  } else if (smallCount > bigCount + 3) {
    predictBig = true;
    reason = 'imbalance';
  } else if (currentStreak >= 3) {
    predictBig = Math.random() < 0.55 ? recent[0].big : !recent[0].big;
    reason = 'streak-follow';
  } else {
    predictBig = Math.random() > 0.5;
    reason = 'random';
  }

  const targetType = predictBig ? 'BIG' : 'SMALL';
  const validNums = candidateNums.filter(c => COLOR_MAP[c.num].type === targetType);
  let predictNum = validNums.length > 0 ? validNums[0].num : (predictBig ? 7 : 2);

  let conf = 58;
  if (currentStreak >= 5) conf += 18;
  else if (currentStreak >= 3) conf += 10;
  if (Math.abs(bigCount - smallCount) > 3) conf += 12;
  if (lossStreak >= 1) conf += 6;
  conf = Math.min(conf, 94);

  return {
    big: predictBig,
    num: predictNum,
    color: COLOR_MAP[predictNum].color,
    emoji: COLOR_MAP[predictNum].emoji,
    confidence: Math.round(conf),
    reason: reason,
    streak: currentStreak
  };
}

// ---------- FETCH ----------
async function fetchHistory() {
  try {
    const res = await fetch(API + Date.now());
    const json = await res.json();
    if (json && json.data && json.data.list) {
      processData(json.data.list);
    } else {
      document.getElementById('status').textContent = 'No data received';
    }
  } catch (e) {
    document.getElementById('status').textContent = 'Connection error — retrying...';
  }
}

// ---------- PROCESS ----------
function processData(list) {
  if (!list || list.length === 0) return;
  const latest = list[0];
  const currentIssue = latest.issueNumber;

  // Next period number
  const issueNum = parseInt(currentIssue);
  const nextPeriod = (issueNum + 1).toString();
  document.getElementById('periodNum').textContent = nextPeriod.slice(-4);

  // Timer sync on new period
  if (lastIssue !== currentIssue) {
    periodEndTime = Date.now() + (PERIOD_SECONDS * 1000);
  }

  // Result check
  if (lastIssue && lastIssue !== currentIssue) {
    if (lastPrediction) {
      const actualNum = parseInt(latest.number);
      const actualBig = actualNum >= 5;
      const won = (actualBig === lastPrediction.big);

      if (won) {
        winCount++;
        lossStreak = 0;
        lastLossSignal = null;
      } else {
        lossCount++;
        lossStreak++;
        lastLossSignal = lastPrediction.big;
      }

      historyData.unshift({
        issue: currentIssue.slice(-4),
        predicted: lastPrediction.big ? 'BIG' : 'SMALL',
        actual: actualNum,
        actualBig: actualBig ? 'BIG' : 'SMALL',
        won: won
      });
      if (historyData.length > 50) historyData.pop();
    }
  }

  lastIssue = currentIssue;

  const prediction = analyze(list);
  if (prediction) {
    lastPrediction = prediction;
    displayPrediction(prediction);
  }

  displayHistory();
  displayStats();
  document.getElementById('status').textContent = '✓ Updated: ' + new Date().toLocaleTimeString();
}

// ---------- DISPLAY ----------
function displayPrediction(p) {
  const bigEl = document.getElementById('signalBig');
  bigEl.textContent = p.big ? 'BIG' : 'SMALL';
  bigEl.className = 'signal-big ' + (p.big ? 'big-color' : 'small-color');

  document.getElementById('signalNum').textContent = p.num;
  document.getElementById('signalEmoji').textContent = p.emoji;
  document.getElementById('signalColor').textContent = p.color;

  document.getElementById('confText').textContent = p.confidence + '%';
  document.getElementById('confFill').style.width = p.confidence + '%';
}

function displayStats() {
  document.getElementById('winCount').textContent = winCount;
  document.getElementById('lossCount').textContent = lossCount;
  document.getElementById('totalCount').textContent = winCount + lossCount;
  document.getElementById('histCount').textContent = historyData.length;
}

function displayHistory() {
  const hist = document.getElementById('history');
  if (historyData.length === 0) {
    hist.innerHTML = '<div class="empty">NO RESULTS YET</div>';
    return;
  }
  hist.innerHTML = historyData.map(h => `
    <div class="history-item">
      <span class="h-issue">#${h.issue}</span>
      <span class="h-pred">${h.predicted}</span>
      <span class="h-actual">${h.actual} ${h.actualBig}</span>
      <span class="h-result ${h.won ? 'win-text' : 'loss-text'}">
        ${h.won ? '✓ WIN' : '✗ LOSS'}
      </span>
    </div>
  `).join('');
}

// ---------- START ----------
setTimeout(fetchHistory, 1000);
setInterval(fetchHistory, REFRESH_MS);
</script>
</body>
</html>
